{% extends "base.html" %}{% block content %}<div class="container"><div class="page-head"><h1>Hotels</h1><p class="muted">Demo hotel inventory. Real booking APIs can be connected later.</p></div><div class="cards">{% for h in hotels %}<div class="card hotel-card"><div class="dest-img hotel-img" style="background-image:url('{% if loop.index % 3 == 1 %}https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1000&q=85{% elif loop.index % 3 == 2 %}https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1000&q=85{% else %}https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=1000&q=85{% endif %}');"><span class="hotel-badge">HOTEL</span></div><h2>{{h.name}}</h2><p>📍 {{h.location}}</p><p>⭐ {{h.rating}} • ₹{{h.price}} / night</p><p class="muted">Wi-Fi • Breakfast • Reception</p><p>☎ {{h.contact}}</p><button class="btn btn-primary" data-demo-book data-type="Hotel" data-destination="{{h.location}}" data-amount="{{h.price}}">Book Hotel</button></div>{% endfor %}</div></div>{% endblock %}
