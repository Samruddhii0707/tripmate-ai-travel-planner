{% extends "base.html" %}{% block content %}<div class="container"><div class="page-head"><h1>My Bookings</h1></div><div class="table-wrap"><table class="table"><tr><th>Type</th><th>Booking ID</th><th>Destination</th><th>Date</th><th>Amount</th><th>Status</th></tr>{% for b in bookings %}<tr><td>{{b.booking_type}}</td><td>{{b.booking_id}}</td><td>{{b.destination}}</td><td>{{b.date or 'Demo date'}}</td><td>₹{{b.amount}}</td><td><span class="badge">{{b.status}}</span></td></tr>{% else %}<tr><td colspan="6">No bookings yet.</td></tr>{% endfor %}</table></div></div>{% endblock %}
