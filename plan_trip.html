{% extends "base.html" %}{% block content %}<div class="container"><div class="page-head"><h1>Plan Your Trip</h1><p class="muted">Tell TripMate what you want and get a personalized itinerary.</p></div><div class="card form-card"><form method="post"><div class="grid">
<div class="field col-6"><label>Starting location</label><input name="starting_location" placeholder="Pune" required></div><div class="field col-6"><label>Destination</label><input name="destination" placeholder="Goa" required></div>
<div class="field col-6"><label>Travel date</label><input id="date" name="date" type="date" required></div><div class="field col-6"><label>Return date</label><input id="return_date" name="return_date" type="date" required></div>
<div class="field col-4"><label>Number of days</label><input id="days" name="days" type="number" min="1" value="3" required></div><div class="field col-4"><label>Travelers</label><input name="travelers" type="number" min="1" value="2"></div><div class="field col-4"><label>Total budget (₹)</label><input name="budget" type="number" min="1" value="15000"></div>
<div class="field col-6"><label>Travel style</label><select name="style"><option>Budget</option><option selected>Moderate</option><option>Luxury</option></select></div><div class="field col-6"><label>Food preference</label><input name="food" placeholder="Vegetarian / Any"></div>
<div class="field col-6"><label>Accommodation</label><select name="accommodation"><option>Budget hotel</option><option>3-star</option><option>Luxury</option></select></div><div class="field col-6"><label>Preferred transport</label><select name="transport"><option>Public transport</option><option>Cab</option><option>Train</option><option>Flight</option><option>Bus</option></select></div>
<div class="field col-12"><label>Interests</label><div class="check-grid">{% for i in ["Nature","Adventure","Historical","Food","Shopping","Beaches","Photography","Entertainment"] %}<label class="check"><input type="checkbox" name="interests" value="{{i}}">{{i}}</label>{% endfor %}</div></div></div><br><button class="btn btn-primary">Generate Personalized Itinerary</button></form></div></div>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/planner.js')}}"></script>{% endblock %}
